<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E4002B;--dark:#0d0d1a;--dark2:#161628;--dark3:#1e1e35;
  --text:#f0f0f8;--text2:#9999bb;--text3:#5555aa;
  --border:#2a2a4a;--card:#1a1a30;--card2:#20203a;
  --green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}

/* CONFIG BANNER */
.config-banner{background:#1a1a00;border:1px solid #444400;border-radius:10px;padding:12px;margin:12px;font-size:12px;color:#ffee77;line-height:1.6}
.config-banner strong{color:#ffe033}
.config-banner code{background:#2a2a00;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:11px}

/* HEADER */
.header{background:var(--dark2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.logo{display:flex;align-items:center;gap:8px}
.srf-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;letter-spacing:.5px}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.sync-indicator{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sync-dot.live{background:var(--green);animation:pulse 2s infinite}
.sync-dot.syncing{background:var(--yellow);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:60px;text-align:center;padding:10px 4px;font-size:10px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#fff;border-bottom:2px solid var(--red)}

/* CONTENT */
.content{flex:1;padding:12px}
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}

/* LOGIN */
.login-wrap{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:40px auto}
.login-wrap h2{font-size:18px;font-weight:600;text-align:center;margin-bottom:8px}
.login-wrap input{height:40px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:0 14px;font-size:14px;outline:none}
.login-wrap input:focus{border-color:var(--red)}
.login-wrap button{height:40px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-wrap .sub{font-size:11px;color:var(--text3);text-align:center}
.avatar-pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.av-opt{font-size:22px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent}
.av-opt.sel{border-color:var(--red)}

/* MATCH CARDS */
.match-card{display:grid;grid-template-columns:1fr 64px 1fr;gap:4px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.team{text-align:center}
.team-flag{font-size:24px;display:block;margin-bottom:3px;line-height:1}
.team-name{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-name.winner{color:var(--green);font-weight:600}
.score-area{text-align:center}
.score{font-size:20px;font-weight:700;color:var(--text);letter-spacing:2px}
.match-meta{font-size:10px;color:var(--text3);margin-top:3px}
.live-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(228,0,43,.15);color:var(--red);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.live-dot{width:5px;height:5px;background:var(--red);border-radius:50%;animation:pulse 1s infinite}

/* TIP ROW */
.tip-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.tip-label{font-size:10px;color:var(--text3);flex:1}
.tip-input{width:38px;height:30px;text-align:center;font-size:15px;font-weight:600;border:1px solid var(--border);border-radius:7px;background:var(--dark3);color:var(--text);-moz-appearance:textfield}
.tip-input::-webkit-outer-spin-button,.tip-input::-webkit-inner-spin-button{-webkit-appearance:none}
.tip-sep{font-size:13px;color:var(--text3);font-weight:600}
.save-btn{font-size:11px;font-weight:600;padding:5px 11px;background:var(--red);color:#fff;border:none;border-radius:7px;cursor:pointer}
.tip-pts{font-size:10px;color:var(--green);font-weight:700;white-space:nowrap}
.tip-saved{font-size:10px;color:var(--text3);white-space:nowrap}

/* RANGLISTE */
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-num{font-size:13px;font-weight:700;width:24px;color:var(--text2);flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:2px solid transparent}
.avatar.me{border-color:var(--red)}
.player-name-row{flex:1;min-width:0}
.player-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:10px;color:var(--text3)}
.pts-big{font-size:16px;font-weight:700;color:var(--text)}
.pts-label{font-size:9px;color:var(--text3);text-align:right}

/* BRACKET */
.bracket-round{margin-bottom:14px}
.round-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.bracket-match{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
.bracket-team{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card)}
.bracket-team:first-child{border-bottom:1px solid var(--border)}
.bracket-team.winner{background:rgba(34,197,94,.08)}
.bracket-flag{font-size:16px}
.bracket-tname{flex:1;font-size:12px;color:var(--text)}
.bracket-score{font-size:13px;font-weight:700;color:var(--text);min-width:18px;text-align:right}

/* GROUPS */
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.group-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.group-title{font-size:11px;font-weight:700;color:var(--red);margin-bottom:6px}
.group-team{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:12px;color:var(--text2)}

/* PUNKTE */
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pt-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px}
.pt-val{font-size:26px;font-weight:700;color:var(--red)}
.pt-desc{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.4}
.phase-h{font-size:13px;font-weight:600;color:var(--text);margin:14px 0 8px 2px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:var(--text2)}

/* FILTER */
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#fff}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark2);color:var(--text);padding:9px 18px;border-radius:25px;font-size:12px;font-weight:500;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

/* ADMIN */
.admin-match{display:grid;grid-template-columns:1fr 30px 1fr;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.admin-match:last-child{border-bottom:none}
.admin-team{font-size:12px;color:var(--text2);text-align:center}
.admin-input{width:36px;height:28px;text-align:center;font-size:14px;border:1px solid var(--border);border-radius:6px;background:var(--dark3);color:var(--text);-moz-appearance:textfield}
.admin-input::-webkit-outer-spin-button,.admin-input::-webkit-inner-spin-button{-webkit-appearance:none}
.admin-save{width:100%;margin-top:6px;padding:7px;background:var(--red);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}

.tab-content{display:none}
.tab-content.active{display:block}
.loading{text-align:center;padding:32px;color:var(--text3);font-size:13px}
</style>
</head>

// ============================================================
// DATA LOADING
// ============================================================
async function loadData(){
  if(!sb) return;
  setSyncStatus('syncing');
  try {
    const [pRes, tRes, mRes] = await Promise.all([
      sb.from('players').select('*').order('pts',{ascending:false}),
      sb.from('tips').select('*'),
      sb.from('matches').select('*'),
    ]);
    if(pRes.data) allPlayers = pRes.data;
    if(tRes.data){
      allTips = {};
      tRes.data.forEach(t=>{ allTips[`${t.match_id}_${t.player_name}`] = t; });
    }
    if(mRes.data && mRes.data.length > 0){
      mRes.data.forEach(dbm=>{
        const local = MATCHES.find(m=>m.id===dbm.id);
        if(local){
          local.hG = dbm.home_goals;
          local.aG = dbm.away_goals;
          local.status = dbm.status||'upcoming';
          local.hN = dbm.home_name||local.hN;
          local.aN = dbm.away_name||local.aN;
          local.home = dbm.home_flag||local.home;
          local.away = dbm.away_flag||local.away;
        }
      });
    }
    setSyncStatus('live');
  } catch(e){
    setSyncStatus('offline');
  }
}

async function fetchLiveResults(){
  // Fetch from API-Football via Supabase Edge Function (avoids CORS)
  // Or directly if API-Football allows browser requests
  if(!CONFIG.footballApiKey || CONFIG.footballApiKey.includes('DEIN')) return;
  try {
    const res = await fetch('https://v3.football.api-sports.io/fixtures?league=1&season=2026&live=all', {
      headers: {'x-apisports-key': CONFIG.footballApiKey}
    });
    const data = await res.json();
    if(!data.response) return;
    let updated = false;
    for(const fix of data.response){
      const hN = fix.teams.home.name;
      const aN = fix.teams.away.name;
      const match = MATCHES.find(m=>
        m.hN.toLowerCase()===hN.toLowerCase() ||
        m.aN.toLowerCase()===aN.toLowerCase()
      );
      if(match){
        const newHG = fix.goals.home;
        const newAG = fix.goals.away;
        const isLive = fix.fixture.status.short==='1H'||fix.fixture.status.short==='2H'||fix.fixture.status.short==='HT'||fix.fixture.status.short==='ET';
        const isDone = fix.fixture.status.short==='FT'||fix.fixture.status.short==='AET'||fix.fixture.status.short==='PEN';
        if(isDone && (match.hG!==newHG || match.aG!==newAG)){
          match.hG = newHG; match.aG = newAG; match.status = 'finished';
          // Save to supabase and recalculate points
          await sb.from('matches').upsert({id:match.id, home_goals:newHG, away_goals:newAG, status:'finished', home_name:match.hN, away_name:match.aN, home_flag:match.home, away_flag:match.away});
          await recalculatePoints(match);
          updated = true;
        } else if(isLive){
          match.hG = newHG; match.aG = newAG; match.status = 'live';
          match.minute = fix.fixture.status.elapsed;
          updated = true;
        }
      }
    }
    if(updated){ rerenderCurrentTab(); showToast('🔄 Resultate aktualisiert!'); }
  } catch(e){ console.log('API-Football error:', e); }
}

async function recalculatePoints(match){
  // Get all tips for this match
  const {data:matchTips} = await sb.from('tips').select('*').eq('match_id', match.id);
  if(!matchTips) return;
  for(const tip of matchTips){
    if(tip.home_tip===null) continue;
    const pts = calcPts(match, tip.home_tip, tip.away_tip);
    await sb.from('tips').update({pts}).eq('id',tip.id);
    // Update player total
    const {data:playerTips} = await sb.from('tips').select('pts').eq('player_name', tip.player_name);
    const total = (playerTips||[]).reduce((s,t)=>s+(t.pts||0),0);
    await sb.from('players').update({pts:total}).eq('name', tip.player_name);
  }
  await loadData();
}

function startAutoRefresh(){
  if(autoRefreshInterval) clearInterval(autoRefreshInterval);
  // Reload data every 60s, fetch live every 3min during matches
  autoRefreshInterval = setInterval(async ()=>{
    await fetchLiveResults();
    await loadData();
    rerenderCurrentTab();
  }, 60000);
}

function buildMatchCard(m, withTip){
  const d = document.createElement('div');
  d.className = 'match-card';
  const hW = m.status==='finished' && m.hG>m.aG;
  const aW = m.status==='finished' && m.aG>m.hG;
  let scoreHtml, badgeHtml;
  if(m.status==='upcoming') scoreHtml=`<div style="font-size:13px;font-weight:600;color:var(--text2)">${m.time}<br><span style="font-size:9px;color:var(--text3)">${m.date}</span></div>`;
  else scoreHtml=`<div class="score">${m.hG} : ${m.aG}</div>`;
  if(m.status==='live') badgeHtml=`<div class="live-badge"><span class="live-dot"></span>${m.minute||'?'}'</div>`;
  else if(m.status==='finished') badgeHtml=`<div class="match-meta">Abgeschlossen</div>`;
  else badgeHtml=`<div class="match-meta">${m.label||'Gr. '+m.group}</div>`;
  d.innerHTML=`
    <div class="team"><span class="team-flag">${m.home}</span><span class="team-name ${hW?'winner':''}">${m.hN}</span></div>
    <div class="score-area">${scoreHtml}${badgeHtml}</div>
    <div class="team"><span class="team-flag">${m.away}</span><span class="team-name ${aW?'winner':''}">${m.aN}</span></div>`;
  if(withTip && currentUser){
    const key = `${m.id}_${currentUser.name}`;
    const saved = allTips[key];

    tr.className = 'tip-row';

      <span class="tip-sep">:</span>
      <input class="tip-input" type="number" min="0" max="20" id="ta_${m.id}" value="${saved?.away_tip??''}">
      <button class="save-btn" onclick="saveTip(${m.id})">OK</button>
      ${pts!==undefined?`<span class="tip-pts">+${pts}Pkt</span>`:saved?`<span class="tip-saved">gespeichert</span>`:''}`;
    d.appendChild(tr);
  }
  return d;
}

async function saveTip(matchId){
  const hEl=document.getElementById(`th_${matchId}`);
  const aEl=document.getElementById(`ta_${matchId}`);
  if(!hEl||!aEl) return;
  const h=hEl.value, a=aEl.value;
  if(h===''||a===''){showToast('⚠️ Beide Felder ausfüllen!');return;}
  const match=MATCHES.find(x=>x.id===matchId);
  if(!match) return;
  const pts = match.status==='finished'?calcPts(match,parseInt(h),parseInt(a)):null;
  const tipData={match_id:matchId, player_name:currentUser.name, home_tip:parseInt(h), away_tip:parseInt(a), pts};
  if(sb){
    const key=`${matchId}_${currentUser.name}`;
    const existing=allTips[key];
    let res;
    if(existing?.id) res=await sb.from('tips').update(tipData).eq('id',existing.id);
    else res=await sb.from('tips').insert(tipData);
    if(!res.error){
      allTips[`${matchId}_${currentUser.name}`]={...tipData};
      if(pts!==null){
        const myTips=Object.values(allTips).filter(t=>t.player_name===currentUser.name&&t.pts!==null);
        const total=myTips.reduce((s,t)=>s+(t.pts||0),0);
        await sb.from('players').upsert({name:currentUser.name,emoji:currentUser.emoji,color:currentUser.color,pts:total},{onConflict:'name'});
        showToast(`🎉 Gespeichert! +${pts} Punkte!`);
      } else showToast('💾 Tipp gespeichert!');
    }
  } else {
    allTips[`${matchId}_${currentUser.name}`]={...tipData};
    showToast('💾 Lokal gespeichert (keine DB)');
  }
  showTab('tippen');
}

async function saveAllResults(){
  showToast('⏳ Wird gespeichert...');
  for(const m of MATCHES){
    const hEl=document.getElementById(`adm_h_${m.id}`);
    const aEl=document.getElementById(`adm_a_${m.id}`);
    if(!hEl||!aEl) continue;
    const h=hEl.value, a=aEl.value;
    if(h===''||a==='') continue;
    const newH=parseInt(h), newA=parseInt(a);
    if(m.hG===newH && m.aG===newA) continue;
    m.hG=newH; m.aG=newA; m.status='finished';
    if(sb){
      await sb.from('matches').upsert({id:m.id,home_goals:newH,away_goals:newA,status:'finished',home_name:m.hN,away_name:m.aN,home_flag:m.home,away_flag:m.away},{onConflict:'id'});
      await recalculatePoints(m);
    }
  }
  await loadData();
  showToast('✅ Gespeichert! Punkte verteilt!');
}

function logout(){ localStorage.removeItem('wm26_user'); currentUser=null; renderLogin(); }

// ============================================================
// SCORING
// ============================================================
function calcPts(m, tipH, tipA){
  if(m.hG===null||m.aG===null) return 0;
  const isKO=m.phase==='ko';
  let pts=0;
  const tW=tipH>tipA?'H':tipH<tipA?'A':'D';
  const rW=m.hG>m.aG?'H':m.hG<m.aG?'A':'D';
  if(tW===rW) pts+=isKO?10:5;
  if(tipH===m.hG) pts+=isKO?2:1;
  if(tipA===m.aG) pts+=isKO?2:1;
  if((tipH-tipA)===(m.hG-m.aG)&&tW===rW) pts+=isKO?6:3;
  return pts;
}

// ============================================================
// HELPERS
// ============================================================
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

init();
</script>
