<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E4002B;--dark:#0d0d1a;--dark2:#161628;--dark3:#1e1e35;--text:#f0f0f8;--text2:#9999bb;--text3:#5555aa;--border:#2a2a4a;--card:#1a1a30;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* HEADER */
.hdr{background:var(--dark2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.srf{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px}
.hdr-title{font-size:15px;font-weight:600}
.sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.dot.live{background:var(--green);animation:pulse 2s infinite}
.dot.spin{background:var(--yellow);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:56px;text-align:center;padding:10px 4px 8px;font-size:10px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--red)}
/* CONTENT */
.cnt{flex:1;padding:12px}
.stitle{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
/* LOGIN */
.login{max-width:300px;margin:32px auto;display:flex;flex-direction:column;gap:10px}
.login h2{font-size:20px;font-weight:600;text-align:center;margin-bottom:4px}
.login p{font-size:12px;color:var(--text3);text-align:center}
.emojis{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.emo{font-size:24px;cursor:pointer;padding:5px;border-radius:8px;border:2px solid transparent;line-height:1}
.emo.sel{border-color:var(--red);background:rgba(228,0,43,.1)}
input.inp{height:40px;border:1px solid var(--border);border-radius:8px;background:var(--dark3);color:var(--text);padding:0 14px;font-size:14px;outline:none;width:100%}
input.inp:focus{border-color:var(--red)}
button.btn{height:40px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
button.btn.red{background:var(--red);color:#fff}
button.btn.blue{background:var(--blue);color:#fff}
button.btn.sm{height:32px;font-size:12px;width:auto;padding:0 14px}
/* MATCH CARDS */
.mc{display:grid;grid-template-columns:1fr 64px 1fr;gap:4px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.tm{text-align:center}
.tm-flag{font-size:26px;display:block;margin-bottom:3px;line-height:1}
.tm-name{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-name.win{color:var(--green);font-weight:600}
.sa{text-align:center}
.sc{font-size:20px;font-weight:700;letter-spacing:2px}
.mm{font-size:10px;color:var(--text3);margin-top:3px}
.live-b{display:inline-flex;align-items:center;gap:3px;background:rgba(228,0,43,.15);color:var(--red);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.live-d{width:5px;height:5px;background:var(--red);border-radius:50%;animation:pulse 1s infinite}
/* TIP ROW */
.tr{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.tl{font-size:10px;color:var(--text3);flex:1}
.ti{width:38px;height:30px;text-align:center;font-size:15px;font-weight:600;border:1px solid var(--border);border-radius:7px;background:var(--dark3);color:var(--text);-moz-appearance:textfield}
.ti::-webkit-outer-spin-button,.ti::-webkit-inner-spin-button{-webkit-appearance:none}
.tsep{font-size:13px;color:var(--text3);font-weight:600}
.sbtn{font-size:11px;font-weight:600;padding:5px 11px;background:var(--red);color:#fff;border:none;border-radius:7px;cursor:pointer}
.tpts{font-size:10px;color:var(--green);font-weight:700;white-space:nowrap}
.tsaved{font-size:10px;color:var(--text3)}
/* RANGLISTE */
.rr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:700;width:26px;color:var(--text2);flex-shrink:0}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid transparent}
.av.me{border-color:var(--red)}
.pnr{flex:1;min-width:0}
.pn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:10px;color:var(--text3)}
.pb{font-size:16px;font-weight:700}
.pl{font-size:9px;color:var(--text3);text-align:right}
/* BRACKET */
.bm{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
.bt{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card)}
.bt:first-child{border-bottom:1px solid var(--border)}
.bt.win{background:rgba(34,197,94,.08)}
.bf{font-size:16px}.bn{flex:1;font-size:12px}.bsc{font-size:13px;font-weight:700;min-width:18px;text-align:right}
/* GROUPS */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.gt{font-size:11px;font-weight:700;color:var(--red);margin-bottom:6px}
.gteam{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:12px;color:var(--text2)}
/* FILTER */
.fr{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fr::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap}
.fb.on{background:var(--red);border-color:var(--red);color:#fff}
/* PUNKTE */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px}
.pv{font-size:26px;font-weight:700;color:var(--red)}
.pd{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.4}
.ph{font-size:13px;font-weight:600;margin:14px 0 8px 2px}
.ir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.ir:last-child{border-bottom:none}
.ir span:first-child{color:var(--text2)}
/* ADMIN */
.ai{display:grid;grid-template-columns:1fr 60px 1fr;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ai:last-child{border-bottom:none}
.ait{font-size:11px;color:var(--text2);text-align:center}
.ain{width:34px;height:28px;text-align:center;font-size:14px;border:1px solid var(--border);border-radius:6px;background:var(--dark3);color:var(--text);-moz-appearance:textfield}
.ain::-webkit-outer-spin-button,.ain::-webkit-inner-spin-button{-webkit-appearance:none}
/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark2);color:var(--text);padding:9px 18px;border-radius:25px;font-size:12px;font-weight:500;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.tc{display:none}.tc.on{display:block}
.loading{text-align:center;padding:40px;color:var(--text3);font-size:13px}
</style>

let DB = null;
let me = JSON.parse(localStorage.getItem('wm26_me')||'null');
let players = [];
let tips = {};
let curTab = 'spiele';
let curFlt = 'Alle';
let curTFlt = 'Alle';
let adminOk = false;
let selEmoji = '😎';

// ── INIT ────────────────────────────────────────────
async function init(){
  DB = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  await loadAll();
  if(!me){ renderLogin(); return; }
  renderShell();
  setInterval(async()=>{ await loadAll(); rerenderTab(); }, 30000);
}

async function loadAll(){
  setSyncStatus('spin');
  try{
    const [pr,tr,mr] = await Promise.all([
      DB.from('players').select('*').order('pts',{ascending:false}),
      DB.from('tips').select('*'),
      DB.from('matches').select('*'),
    ]);
    if(pr.data) players=pr.data;
    if(tr.data){ tips={}; tr.data.forEach(t=>tips[t.match_id+'_'+t.player_name]=t); }
    if(mr.data) mr.data.forEach(dbm=>{
      const m=MATCHES.find(x=>x.id===dbm.id);
      if(m){ m.hG=dbm.home_goals; m.aG=dbm.away_goals; m.status=dbm.status||'upcoming';
        if(dbm.home_name) m.hN=dbm.home_name;
        if(dbm.away_name) m.aN=dbm.away_name;
        if(dbm.home_flag) m.f=dbm.home_flag;
        if(dbm.away_flag) m.af=dbm.away_flag;
      }
    });
    setSyncStatus('live');
  }catch(e){ setSyncStatus('off'); }
}

async function doLogin(){
  const name=document.getElementById('ln').value.trim();

  const colors=['#E4002B','#3b82f6','#22c55e','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#10b981','#a855f7','#14b8a6','#ef4444','#84cc16','#e11d48','#6366f1'];

function setSyncStatus(s){
  const d=document.getElementById('sdot'),t=document.getElementById('stxt');
  if(!d) return;
  d.className='dot'+(s==='live'?' live':s==='spin'?' spin':'');
  t.textContent=s==='live'?'Live':s==='spin'?'Lädt...':'Offline';
}

let rerenderTab=()=>showTab(curTab);

function showTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('tb-'+t)?.classList.add('on');
  const c=document.getElementById('cnt'); if(!c) return;
  if(t==='spiele') renderSpiele(c);
  else if(t==='tippen') renderTippen(c);
  else if(t==='rangliste') renderRangliste(c);
  else if(t==='bracket') renderBracket(c);
  else if(t==='punkte') renderPunkte(c);
  else if(t==='admin') renderAdmin(c);
}

// ── SPIELE ───────────────────────────────────────────
function fltMatches(f){
  if(f==='Alle') return MATCHES;
  if(f==='K.O.') return MATCHES.filter(m=>m.phase==='ko');
  return MATCHES.filter(m=>m.group===f.replace('Gruppe ',''));
}
const GRP_BTNS=['Alle','Gruppe A','Gruppe B','Gruppe C','Gruppe D','Gruppe E','Gruppe F','Gruppe G','Gruppe H','Gruppe I','Gruppe J','Gruppe K','Gruppe L','K.O.'];

function renderSpiele(c){
  c.innerHTML=`<div class="fr">${GRP_BTNS.map(g=>`<button class="fb ${curFlt===g?'on':''}" onclick="curFlt='${g}';showTab('spiele')">${g}</button>`).join('')}</div><div id="ml"></div>`;
  const ml=document.getElementById('ml');
  fltMatches(curFlt).forEach(m=>ml.appendChild(mkCard(m,false)));
}

function mkCard(m,withTip){
  const d=document.createElement('div'); d.className='mc';
  const fin=m.status==='finished', live=m.status==='live', up=!fin&&!live;
  const hW=fin&&m.hG>m.aG, aW=fin&&m.aG>m.hG;
  let scoreH=up?`<div style="font-size:13px;font-weight:600;color:var(--text2)">${m.time}<br><span style="font-size:9px;color:var(--text3)">${m.date}</span></div>`:`<div class="sc">${m.hG} : ${m.aG}</div>`;
  let badge=live?`<div class="live-b"><span class="live-d"></span>${m.minute||'?'}'</div>`:fin?`<div class="mm">Abgeschlossen</div>`:`<div class="mm">${m.label||'Gr.'+m.group}</div>`;
  d.innerHTML=`
    <div class="tm"><span class="tm-flag">${m.f}</span><span class="tm-name ${hW?'win':''}">${m.hN}</span></div>
    <div class="sa">${scoreH}${badge}</div>
    <div class="tm"><span class="tm-flag">${m.af}</span><span class="tm-name ${aW?'win':''}">${m.aN}</span></div>`;
  if(withTip&&me){
    const key=m.id+'_'+me.name, sv=tips[key];
    const ptsHtml=sv?.pts!=null?`<span class="tpts">+${sv.pts}Pkt</span>`:sv?`<span class="tsaved">✓</span>`:'';
    const tr=document.createElement('div'); tr.className='tr';
    tr.innerHTML=`<span class="tl">Mein Tipp:</span>
      <input class="ti" type="number" min="0" max="20" id="th_${m.id}" value="${sv?.home_tip??''}">
      <span class="tsep">:</span>
      <input class="ti" type="number" min="0" max="20" id="ta_${m.id}" value="${sv?.away_tip??''}">
      <button class="sbtn" onclick="saveTip(${m.id})">OK</button>${ptsHtml}`;
    d.appendChild(tr);
  }
  return d;
}

// ── TIPPEN ───────────────────────────────────────────
function renderTippen(c){
  c.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:12px">
      <span style="font-size:22px">${me.emoji}</span>
      <span style="font-size:14px;font-weight:600">${me.name}</span>
      <button class="sbtn" style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text2)" onclick="localStorage.removeItem('wm26_me');me=null;renderLogin()">Wechseln</button>
    </div>
    <div class="fr">${GRP_BTNS.map(g=>`<button class="fb ${curTFlt===g?'on':''}" onclick="curTFlt='${g}';showTab('tippen')">${g}</button>`).join('')}</div>
    <div id="tl"></div>`;
  const tl=document.getElementById('tl');
  fltMatches(curTFlt).forEach(m=>tl.appendChild(mkCard(m,true)));
}

async function saveTip(mid){
  const h=document.getElementById('th_'+mid)?.value;
  const a=document.getElementById('ta_'+mid)?.value;
  if(h===''||a===''||h===null||a===null){toast('⚠️ Beide Felder ausfüllen!');return;}
  const m=MATCHES.find(x=>x.id===mid); if(!m) return;
  const fin=m.status==='finished';
  const pts=fin?calcPts(m,+h,+a):null;
  const key=mid+'_'+me.name;
  const existing=tips[key];
  let res;
  if(existing?.id) res=await DB.from('tips').update({home_tip:+h,away_tip:+a,pts}).eq('id',existing.id);
  else res=await DB.from('tips').insert({match_id:mid,player_name:me.name,home_tip:+h,away_tip:+a,pts});
  if(res.error){toast('❌ Fehler beim Speichern!');return;}
  if(fin&&pts!==null){
    const {data:myT}=await DB.from('tips').select('pts').eq('player_name',me.name);
    const total=(myT||[]).reduce((s,t)=>s+(t.pts||0),0);
    await DB.from('players').upsert({name:me.name,emoji:me.emoji,color:me.color,pts:total},{onConflict:'name'});
    toast(`🎉 +${pts} Punkte!`);
  } else toast('💾 Tipp gespeichert!');
  await loadAll();
  showTab('tippen');
}

        <div class="ait">${m.f} ${m.hN}</div>
        <div style="display:flex;align-items:center;gap:3px;justify-content:center">
          <input class="ain" type="number" min="0" max="20" id="ah_${m.id}" value="${m.hG??''}">
          <span style="color:var(--text3)">:</span>
          <input class="ain" type="number" min="0" max="20" id="aa_${m.id}" value="${m.aG??''}">
        </div>
        <div class="ait">${m.af} ${m.aN}</div>
      </div>`).join('')}
      <button class="btn red" style="margin-top:10px" onclick="saveAll()">💾 Alle speichern & Punkte verteilen</button>
    </div>
    <div class="stitle">K.O.-Spiele</div>
    <div class="card">
      ${koMs.map(m=>`<div class="ai">
        <div class="ait" style="font-size:10px">${m.hN}</div>
        <div style="display:flex;align-items:center;gap:3px;justify-content:center">
          <input class="ain" type="number" min="0" max="20" id="ah_${m.id}" value="${m.hG??''}">
          <span style="color:var(--text3)">:</span>
          <input class="ain" type="number" min="0" max="20" id="aa_${m.id}" value="${m.aG??''}">
        </div>
        <div class="ait" style="font-size:10px">${m.aN}</div>
      </div>`).join('')}
      <button class="btn red" style="margin-top:10px" onclick="saveAll()">💾 K.O.-Resultate speichern</button>
    </div>`;
}

function chkAdmin(){
  if(document.getElementById('apw').value===ADMIN_PW){ adminOk=true; showTab('admin'); }
  else toast('❌ Falsches Passwort!');
}

async function saveAll(){
  toast('⏳ Wird gespeichert...');
  for(const m of MATCHES){
    const hEl=document.getElementById('ah_'+m.id), aEl=document.getElementById('aa_'+m.id);
    if(!hEl||!aEl||hEl.value===''||aEl.value==='') continue;
    const nh=+hEl.value, na=+aEl.value;
    if(m.hG===nh&&m.aG===na) continue;
    m.hG=nh; m.aG=na; m.status='finished';
    await DB.from('matches').upsert({id:m.id,home_goals:nh,away_goals:na,status:'finished',home_name:m.hN,away_name:m.aN,home_flag:m.f,away_flag:m.af},{onConflict:'id'});
    // recalc tips for this match
    const {data:mTips}=await DB.from('tips').select('*').eq('match_id',m.id);
    for(const tip of (mTips||[])){
      const pts=calcPts(m,tip.home_tip,tip.away_tip);
      await DB.from('tips').update({pts}).eq('id',tip.id);
    }
  }
  // recalc all player totals
  const {data:allT}=await DB.from('tips').select('*');
  const totals={};
  (allT||[]).forEach(t=>{ totals[t.player_name]=(totals[t.player_name]||0)+(t.pts||0); });
  for(const [name,pts] of Object.entries(totals)){
    await DB.from('players').update({pts}).eq('name',name);
  }
  await loadAll();
  toast('✅ Gespeichert! Punkte verteilt!');
  showTab('admin');
}

// ── SCORING ──────────────────────────────────────────
function calcPts(m,h,a){
  if(m.hG===null||m.aG===null) return 0;
  const ko=m.phase==='ko'; let p=0;
  const tw=h>a?'H':h<a?'A':'D', rw=m.hG>m.aG?'H':m.hG<m.aG?'A':'D';
  if(tw===rw) p+=ko?10:5;
  if(h===m.hG) p+=ko?2:1;
  if(a===m.aG) p+=ko?2:1;
  if((h-a)===(m.hG-m.aG)&&tw===rw) p+=ko?6:3;
  return p;
}

// ── HELPERS ──────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

init();
</script>
