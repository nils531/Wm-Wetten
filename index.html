<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E4002B;--dark:#0d0d1a;--dark2:#161628;--dark3:#1e1e35;--text:#f0f0f8;--text2:#9999bb;--text3:#5555aa;--border:#2a2a4a;--card:#1a1a30;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--dark2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.srf{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px}
.sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.dot.live{background:var(--green);animation:pulse 2s infinite}
.dot.spin{background:var(--yellow);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:56px;text-align:center;padding:10px 4px 8px;font-size:10px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--red)}
.cnt{flex:1;padding:12px}
.stitle{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.login{max-width:300px;margin:32px auto;display:flex;flex-direction:column;gap:10px}
.login h2{font-size:20px;font-weight:600;text-align:center;margin-bottom:4px}
.login p{font-size:12px;color:var(--text3);text-align:center}
.emojis{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.emo{font-size:24px;cursor:pointer;padding:5px;border-radius:8px;border:2px solid transparent;line-height:1}
.emo.sel{border-color:var(--red);background:rgba(228,0,43,.1)}
input.inp{height:40px;border:1px solid var(--border);border-radius:8px;background:var(--dark3);color:var(--text);padding:0 14px;font-size:14px;outline:none;width:100%}
input.inp:focus{border-color:var(--red)}
button.btn{height:40px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
button.btn.red{background:var(--red);color:#fff}
button.btn.blue{background:var(--blue);color:#fff}
button.btn.sm{height:32px;font-size:12px;width:auto;padding:0 14px}
.mc{display:grid;grid-template-columns:1fr 64px 1fr;gap:4px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.tm{text-align:center}
.tm-flag{font-size:26px;display:block;margin-bottom:3px;line-height:1}
.tm-name{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-name.win{color:var(--green);font-weight:600}
.sa{text-align:center}
.sc{font-size:20px;font-weight:700;letter-spacing:2px}
.mm{font-size:10px;color:var(--text3);margin-top:3px}
.live-b{display:inline-flex;align-items:center;gap:3px;background:rgba(228,0,43,.15);color:var(--red);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.live-d{width:5px;height:5px;background:var(--red);border-radius:50%;animation:pulse 1s infinite}
.tr{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.tl{font-size:10px;color:var(--text3);flex:1}
.ti{width:38px;height:30px;text-align:center;font-size:15px;font-weight:600;border:1px solid var(--border);border-radius:7px;background:var(--dark3);color:var(--text);-moz-appearance:textfield}
.ti::-webkit-outer-spin-button,.ti::-webkit-inner-spin-button{-webkit-appearance:none}
.tsep{font-size:13px;color:var(--text3);font-weight:600}
.sbtn{font-size:11px;font-weight:600;padding:5px 11px;background:var(--red);color:#fff;border:none;border-radius:7px;cursor:pointer}
.sbtn:disabled{background:var(--dark3);color:var(--text3);cursor:not-allowed}
.tpts{font-size:10px;color:var(--green);font-weight:700;white-space:nowrap}
.tsaved{font-size:10px;color:var(--text3)}
.locked-badge{font-size:10px;color:var(--yellow);font-weight:600;white-space:nowrap}
/* ANDERE TIPPS */
.others-tips{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.other-tip-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10px;color:var(--text2)}
.other-tip-score{font-weight:700;color:var(--text);font-size:11px;min-width:32px;text-align:center}
.rr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:700;width:26px;color:var(--text2);flex-shrink:0}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid transparent}
.av.me{border-color:var(--red)}
.pnr{flex:1;min-width:0}
.pn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:10px;color:var(--text3)}
.pb{font-size:16px;font-weight:700}
.pl{font-size:9px;color:var(--text3);text-align:right}
.bm{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
.bt{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card)}
.bt:first-child{border-bottom:1px solid var(--border)}
.bt.win{background:rgba(34,197,94,.08)}
.bf{font-size:16px}.bn{flex:1;font-size:12px}.bsc{font-size:13px;font-weight:700;min-width:18px;text-align:right}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.gt{font-size:11px;font-weight:700;color:var(--red);margin-bottom:6px}
.gteam{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:12px;color:var(--text2)}
.fr{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fr::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap}
.fb.on{background:var(--red);border-color:var(--red);color:#fff}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px}
.pv{font-size:26px;font-weight:700;color:var(--red)}
.pd{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.4}
.ph{font-size:13px;font-weight:600;margin:14px 0 8px 2px}
.ir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.ir:last-child{border-bottom:none}
.ir span:first-child{color:var(--text2)}
/* ADMIN */
.admin-info{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.admin-row:last-child{border-bottom:none}
.admin-row span:first-child{color:var(--text2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge.green{background:rgba(34,197,94,.15);color:var(--green)}
.badge.yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge.red{background:rgba(228,0,43,.15);color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark2);color:var(--text);padding:9px 18px;border-radius:25px;font-size:12px;font-weight:500;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.tc{display:none}.tc.on{display:block}
.loading{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.api-status{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:10px}
.api-status.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green)}
.api-status.err{background:rgba(228,0,43,.1);border:1px solid rgba(228,0,43,.2);color:var(--red)}

// ── HILFSFUNKTION: Spielzeit-Check ──────────────────
function getMatchDateTime(m) {
  // Parst "11.06." + "21:00" → Date object (Jahr 2026)
  const parts = m.date.split('.');
  const day = parseInt(parts[0]);
  const month = parseInt(parts[1]) - 1;
  const [h, min] = m.time.split(':').map(Number);
  return new Date(2026, month, day, h, min, 0);
}

function isLocked(m) {
  // Gesperrt wenn: Spiel läuft, fertig, oder weniger als 5 Min bis Anpfiff
  if (m.status === 'finished' || m.status === 'live') return true;
  const kickoff = getMatchDateTime(m);
  const now = new Date();
  return (kickoff - now) < 5 * 60 * 1000; // 5 Minuten
}

function minutesUntilKickoff(m) {
  const kickoff = getMatchDateTime(m);
  return Math.round((kickoff - new Date()) / 60000);
}

// ── FOOTBALL API ─────────────────────────────────────
async function fetchMatchesFromAPI() {
  try {
    const url = `https://api.football-data.org/v4/competitions/${WC_COMPETITION_ID}/matches`;
    const res = await fetch(url, {
      headers: { 'X-Auth-Token': FOOTBALL_API_KEY }
    });
    if (!res.ok) {
      apiStatus = { ok: false, lastSync: new Date(), error: `API Fehler: ${res.status}` };
      return false;
    }
    const data = await res.json();
    let updated = 0;
    for (const apiMatch of (data.matches || [])) {
      // Match anhand von Team-Namen zuordnen
      const localMatch = MATCHES.find(m =>
        normalizeTeam(m.hN) === normalizeTeam(apiMatch.homeTeam?.name) &&
        normalizeTeam(m.aN) === normalizeTeam(apiMatch.awayTeam?.name)
      );
      if (!localMatch) continue;
      const score = apiMatch.score;
      const newStatus = mapApiStatus(apiMatch.status);
      const hG = score?.fullTime?.home ?? null;
      const aG = score?.fullTime?.away ?? null;
      const minute = apiMatch.minute || null;
      // Nur updaten wenn sich etwas geändert hat
      if (localMatch.hG === hG && localMatch.aG === aG && localMatch.status === newStatus) continue;
      localMatch.hG = hG;
      localMatch.aG = aG;
      localMatch.status = newStatus;
      localMatch.minute = minute;
      // In Supabase speichern
      await DB.from('matches').upsert({
        id: localMatch.id,
        home_goals: hG,
        away_goals: aG,
        status: newStatus,
        home_name: localMatch.hN,
        away_name: localMatch.aN,
        home_flag: localMatch.f,
        away_flag: localMatch.af,
        minute: minute
      }, { onConflict: 'id' });
      // Punkte für alle Tipps auf dieses Spiel neu berechnen
      if (newStatus === 'finished' && hG !== null && aG !== null) {
        await recalcTipsForMatch(localMatch);
      }
      updated++;
    }
    if (updated > 0) {
      await recalcAllPlayerTotals();
    }
    apiStatus = { ok: true, lastSync: new Date(), matchesUpdated: updated };
    return true;
  } catch(e) {
    apiStatus = { ok: false, lastSync: new Date(), error: e.message };
    return false;
  }
}

function normalizeTeam(name) {
  if (!name) return '';
  return name.toLowerCase()
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ä/g,'a')
    .replace(/\s+/g,'').replace(/-/g,'');
}

function mapApiStatus(s) {
  if (!s) return 'upcoming';
  if (s === 'FINISHED' || s === 'AWARDED') return 'finished';
  if (s === 'IN_PLAY' || s === 'PAUSED' || s === 'HALFTIME') return 'live';
  return 'upcoming';
}

async function recalcTipsForMatch(m) {
  const { data: mTips } = await DB.from('tips').select('*').eq('match_id', m.id);
  for (const tip of (mTips || [])) {
    const pts = calcPts(m, tip.home_tip, tip.away_tip);
    await DB.from('tips').update({ pts }).eq('id', tip.id);
    // Lokalen Cache updaten
    const key = m.id + '_' + tip.player_name;
    if (tips[key]) tips[key].pts = pts;
  }
}

async function recalcAllPlayerTotals() {
  const { data: allT } = await DB.from('tips').select('*');
  const totals = {};
  (allT || []).forEach(t => { totals[t.player_name] = (totals[t.player_name] || 0) + (t.pts || 0); });
  for (const [name, pts] of Object.entries(totals)) {
    await DB.from('players').update({ pts }).eq('name', name);
  }
}

// ── INIT ─────────────────────────────────────────────
async function init() {
  DB = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  await loadAll();
  // Erster API-Abruf
  await fetchMatchesFromAPI();
  await loadAll();
  if (!me) { renderLogin(); return; }
  renderShell();
  // Regelmässig API abrufen
  setInterval(async () => {
    await fetchMatchesFromAPI();
    await loadAll();
    rerenderTab();
  }, API_REFRESH_INTERVAL);
  // UI Refresh
  setInterval(async () => {
    await loadAll();
    rerenderTab();
  }, UI_REFRESH_INTERVAL);
}

async function loadAll() {
  setSyncStatus('spin');
  try {
    const [pr, tr, mr] = await Promise.all([
      DB.from('players').select('*').order('pts', { ascending: false }),
      DB.from('tips').select('*'),
      DB.from('matches').select('*'),
    ]);
    if (pr.data) players = pr.data;
    if (tr.data) { tips = {}; tr.data.forEach(t => tips[t.match_id + '_' + t.player_name] = t); }
    if (mr.data) mr.data.forEach(dbm => {
      const m = MATCHES.find(x => x.id === dbm.id);
      if (m) {
        m.hG = dbm.home_goals; m.aG = dbm.away_goals; m.status = dbm.status || 'upcoming';
        m.minute = dbm.minute || null;
        if (dbm.home_name) m.hN = dbm.home_name;
        if (dbm.away_name) m.aN = dbm.away_name;
        if (dbm.home_flag) m.f = dbm.home_flag;
        if (dbm.away_flag) m.af = dbm.away_flag;
      }
    });
    setSyncStatus('live');
  } catch(e) { setSyncStatus('off'); }
}

        <span class="tsep">:</span>
        <input class="ti" type="number" min="0" max="20" id="ta_${m.id}" value="${sv?.away_tip ?? ''}">
        <button class="sbtn" onclick="saveTip(${m.id})">OK</button>${ptsHtml}`;
    }
    d.appendChild(tr);
  }
  return d;
}

// ── TIPPEN ────────────────────────────────────────────
function renderTippen(c) {
  c.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:12px">
      <span style="font-size:22px">${me.emoji}</span>
      <span style="font-size:14px;font-weight:600">${me.name}</span>
      <button class="sbtn" style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text2)" onclick="localStorage.removeItem('wm26_me');me=null;renderLogin()">Wechseln</button>
    </div>
    <div style="font-size:11px;color:var(--yellow);padding:8px 10px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;margin-bottom:10px">
      🔒 Tipps werden 5 Min. vor Spielbeginn automatisch gesperrt
    </div>
    <div class="fr">${GRP_BTNS.map(g => `<button class="fb ${curTFlt===g?'on':''}" onclick="curTFlt='${g}';showTab('tippen')">${g}</button>`).join('')}</div>
    <div id="tl"></div>`;
  const tl = document.getElementById('tl');
  fltMatches(curTFlt).forEach(m => tl.appendChild(mkCard(m, true)));
}

async function saveTip(mid) {
  const m = MATCHES.find(x => x.id === mid); if (!m) return;
  if (isLocked(m)) { toast('🔒 Tipp bereits gesperrt!'); return; }
  const h = document.getElementById('th_' + mid)?.value;
  const a = document.getElementById('ta_' + mid)?.value;
  if (h === '' || a === '' || h === null || a === null) { toast('⚠️ Beide Felder ausfüllen!'); return; }
  const fin = m.status === 'finished';
  const pts = fin ? calcPts(m, +h, +a) : null;
  const key = mid + '_' + me.name;
  const existing = tips[key];
  let res;
  if (existing?.id) res = await DB.from('tips').update({ home_tip: +h, away_tip: +a, pts }).eq('id', existing.id);
  else res = await DB.from('tips').insert({ match_id: mid, player_name: me.name, home_tip: +h, away_tip: +a, pts });
  if (res.error) { toast('❌ Fehler beim Speichern!'); return; }
  if (fin && pts !== null) {
    const { data: myT } = await DB.from('tips').select('pts').eq('player_name', me.name);
    const total = (myT || []).reduce((s, t) => s + (t.pts || 0), 0);
    await DB.from('players').upsert({ name: me.name, emoji: me.emoji, color: me.color, pts: total }, { onConflict: 'name' });
    toast(`🎉 +${pts} Punkte!`);
  } else toast('💾 Tipp gespeichert!');
  await loadAll();
  showTab('tippen');
}

// ── RANGLISTE ─────────────────────────────────────────
function renderRangliste(c) {
  const s = [...players].sort((a, b) => b.pts - a.pts);
  const medals = ['🥇','🥈','🥉'];
  c.innerHTML = `<div class="stitle">Rangliste · ${s.length} Spieler</div>
  <div class="card">${s.length ? s.map((p, i) => `
    <div class="rr">
      <div class="rn">${medals[i] || '#' + (i + 1)}</div>
      <div class="av ${me?.name === p.name ? 'me' : ''}">${p.emoji || '😎'}</div>
      <div class="pnr"><div class="pn">${p.name}${me?.name === p.name ? ' (Du)' : ''}</div><div class="ps">${Object.values(tips).filter(t => t.player_name === p.name).length} Tipps</div></div>
      <div><div class="pb">${p.pts || 0}</div><div class="pl">Punkte</div></div>
    </div>`).join('') : '<div style="text-align:center;padding:24px;color:var(--text3)">Noch keine Spieler</div>'}</div>`;
}

// ── BRACKET ───────────────────────────────────────────
function renderBracket(c) {
  c.innerHTML = `<div class="stitle">12 Gruppen · 48 Teams</div>
  <div class="gg">${Object.entries(GROUPS).map(([g, teams]) => `
    <div class="gc"><div class="gt">GRUPPE ${g}</div>${teams.map(t => `<div class="gteam">${t.f} ${t.n}</div>`).join('')}</div>`).join('')}</div>
  <div class="stitle" style="margin-top:16px">K.O.-Bracket</div>
  ${['Achtelfinale','Viertelfinale','Halbfinale','🏆 FINAL'].map(lbl => {
    const ms = MATCHES.filter(m => m.label === lbl); if (!ms.length) return '';
    return `<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${lbl}</div>
    ${ms.map(m => `<div class="bm">
      <div class="bt ${m.hG != null && m.hG > m.aG ? 'win' : ''}"><span class="bf">${m.f}</span><span class="bn">${m.hN}</span><span class="bsc">${m.hG != null ? m.hG : '–'}</span></div>
      <div class="bt ${m.aG != null && m.aG > m.hG ? 'win' : ''}"><span class="bf">${m.af}</span><span class="bn">${m.aN}</span><span class="bsc">${m.aG != null ? m.aG : '–'}</span></div>
    </div>`).join('')}</div>`;
  }).join('')}`;
}

// ── PUNKTE ────────────────────────────────────────────
function renderPunkte(c) {
  c.innerHTML = `
  <div class="ph">🟢 Gruppenphase</div>
  <div class="pg">
    <div class="pc"><div class="pv">5</div><div class="pd">Sieger / Unentschieden korrekt</div></div>
    <div class="pc"><div class="pv">1</div><div class="pd">Korrekte Heim-Tore</div></div>
    <div class="pc"><div class="pv">1</div><div class="pd">Korrekte Gast-Tore</div></div>
    <div class="pc"><div class="pv">3</div><div class="pd">Korrekte Tordifferenz</div></div>
  </div>
  <div class="ph">🔴 K.O.-Phase</div>
  <div class="pg">
    <div class="pc"><div class="pv">10</div><div class="pd">Sieger / Unentschieden korrekt</div></div>
    <div class="pc"><div class="pv">2</div><div class="pd">Korrekte Heim-Tore</div></div>
    <div class="pc"><div class="pv">2</div><div class="pd">Korrekte Gast-Tore</div></div>
    <div class="pc"><div class="pv">6</div><div class="pd">Korrekte Tordifferenz</div></div>
  </div>
  <div class="card" style="margin-top:8px">
    <div class="ir"><span>Tipp abgeben bis</span><span>5 Min. vor Anpfiff</span></div>
    <div class="ir"><span>Tipps anderer sehen</span><span>Ab Spielsperre</span></div>
    <div class="ir"><span>Resultate werden</span><span>Automatisch geladen</span></div>
    <div class="ir"><span>Bei Verlängerung</span><span>Resultat nach 120 Min.</span></div>
    <div class="ir"><span>Penalty-Tore</span><span>Werden nicht gewertet</span></div>
  </div>`;
}

// ── ADMIN ─────────────────────────────────────────────
function renderAdmin(c) {
  if (!adminOk) {
    c.innerHTML = `<div style="max-width:260px;margin:40px auto;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">🔑</div>
      <input class="inp" id="apw" type="password" placeholder="Admin-Passwort..." style="margin-bottom:8px" onkeydown="if(event.key==='Enter')chkAdmin()">
      <button class="btn red" onclick="chkAdmin()">Einloggen</button>
    </div>`; return;
  }

  const now = new Date();
  const liveMs = MATCHES.filter(m => m.status === 'live').length;
  const finMs = MATCHES.filter(m => m.status === 'finished').length;
  const upMs = MATCHES.filter(m => m.status !== 'live' && m.status !== 'finished').length;
  const lastSync = apiStatus.lastSync ? apiStatus.lastSync.toLocaleTimeString('de-CH') : '–';

  const apiKey = false; // Key ist eingetragen

  c.innerHTML = `
    <div class="stitle">🤖 Automatischer Betrieb</div>
    
    <div class="${apiKey ? 'api-status warn' : apiStatus.ok ? 'api-status ok' : 'api-status err'}">
      ${apiKey ? '⚠️ Kein API Key eingetragen – Resultate werden nicht automatisch geladen' :
        apiStatus.ok ? `✅ API aktiv · Letzter Sync: ${lastSync} · ${apiStatus.matchesUpdated} Updates` :
        `❌ API Fehler: ${apiStatus.error || 'Unbekannt'}`}
    </div>

    ${apiKey ? `
    <div class="card" style="margin-bottom:10px">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600">📋 API Key einrichten</div>
      <div style="font-size:11px;color:var(--text3);line-height:1.6">
        1. Kostenlos registrieren: <span style="color:var(--blue)">football-data.org</span><br>
        2. API Key kopieren<br>
        3. Im HTML-Code <code style="background:var(--dark3);padding:1px 4px;border-radius:3px">99b86d8aae674256a1aa91ed1a1c943e</code> ersetzen<br>
        4. Datei neu laden
      </div>
    </div>` : ''}

    <div class="admin-info">
      <div class="admin-row"><span>Spiele Live</span><span class="badge green">🔴 ${liveMs}</span></div>
      <div class="admin-row"><span>Spiele Abgeschlossen</span><span class="badge green">✅ ${finMs}</span></div>
      <div class="admin-row"><span>Spiele Ausstehend</span><span class="badge yellow">⏳ ${upMs}</span></div>
      <div class="admin-row"><span>Spieler registriert</span><span class="badge green">👥 ${players.length}</span></div>
      <div class="admin-row"><span>Tipps total</span><span class="badge green">✏️ ${Object.keys(tips).length}</span></div>
      <div class="admin-row"><span>API Refresh</span><span style="font-size:11px;color:var(--text2)">alle ${API_REFRESH_INTERVAL/1000}s</span></div>
    </div>

    <div class="stitle" style="margin-top:4px">Manuelle Aktionen</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn blue" onclick="manualApiRefresh()">🔄 API Jetzt abrufen</button>
      <button class="btn" style="background:var(--dark3);color:var(--text2);border:1px solid var(--border)" onclick="confirmDeleteAll()">🗑️ Alle Spieler löschen</button>
    </div>

    <div class="stitle" style="margin-top:14px">Live-Updates der letzten Spiele</div>
    <div style="max-height:200px;overflow-y:auto">
      ${MATCHES.filter(m => m.status === 'live' || m.status === 'finished').slice(-8).reverse().map(m => `
        <div class="admin-row">
          <span style="font-size:11px">${m.f} ${m.hN} vs ${m.aN} ${m.af}</span>
          <span class="badge ${m.status === 'live' ? 'red' : 'green'}" style="font-size:10px">
            ${m.status === 'live' ? (m.minute ? m.minute+"'" : 'Live') : (m.hG + ':' + m.aG)}
          </span>
        </div>`).join('') || '<div style="font-size:12px;color:var(--text3);padding:8px 0">Noch keine abgeschlossenen Spiele</div>'}
    </div>`;
}

async function manualApiRefresh() {
  toast('⏳ API wird abgerufen...');
  const ok = await fetchMatchesFromAPI();
  await loadAll();
  toast(ok ? `✅ ${apiStatus.matchesUpdated} Spiele aktualisiert` : '❌ API Fehler – siehe Admin');
  showTab('admin');
}

async function confirmDeleteAll() {
  if (!confirm('⚠️ Wirklich ALLE Spieler und Tipps löschen? Diese Aktion kann nicht rückgängig gemacht werden!')) return;
  toast('⏳ Wird gelöscht...');
  await DB.from('tips').delete().neq('id', 0);
  await DB.from('players').delete().neq('name', '');
  players = []; tips = {};
  toast('✅ Alle Spieler gelöscht!');
  showTab('admin');
}

function chkAdmin() {
  if (document.getElementById('apw').value === ADMIN_PW) { adminOk = true; showTab('admin'); }
  else toast('❌ Falsches Passwort!');
}

// ── SCORING ───────────────────────────────────────────
function calcPts(m, h, a) {
  if (m.hG === null || m.aG === null) return 0;
  const ko = m.phase === 'ko'; let p = 0;
  const tw = h > a ? 'H' : h < a ? 'A' : 'D', rw = m.hG > m.aG ? 'H' : m.hG < m.aG ? 'A' : 'D';
  if (tw === rw) p += ko ? 10 : 5;
  if (h === m.hG) p += ko ? 2 : 1;
  if (a === m.aG) p += ko ? 2 : 1;
  if ((h - a) === (m.hG - m.aG) && tw === rw) p += ko ? 6 : 3;
  return p;
}

// ── HELPERS ───────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>
